; Castaway Continuum V1.0.0 configuration. Lines beginning with ; are comments.
; Edit values after =. Examples are at the bottom.

[CastawayContinuum]
; true = window, false = fullscreen screensaver.
windowed=false
; true starts a windowed display maximized.
full_size_window=false
; true keeps a windowed display above normal application windows.
always_on_top=false
; Legacy compatibility setting (clicks now toggle display mode).
ignore_mouse_close=false
; true moves the window to the primary display if its monitor disconnects.
return_to_primary=true
; true disables sounds.
mute=false
; Playback speed: 25..400; 100 is original timing.
speed=100
; fit | stretch | integer | extend.
scale=fit
; nearest | linear | xbr | xbrz.
filter=linear
; true smooths original dither; false preserves it.
dedither=false
; true enables date-based holiday props/animations.
holiday_animations=true

; original = 1992 accelerated 8-hour cycle; real24h = wall-clock cycle.
daynight=original
; true exposes diagnostics.
debug=false
; true shows current scene information directly on the display.
scene_info_overlay=false
; top_left | top_right | bottom_left | bottom_right.
scene_info_corner=top_left
; true includes the longer scene description; false shows number and short name only.
scene_info_long_description=true
; off | light | medium | strong CRT scanlines.
crt_scanlines=off
; off | gentle | curved | strong CRT screen curvature.
crt_curvature=off
; off | subtle | visible RGB phosphor grille.
crt_phosphor_mask=off
; off | subtle bright-pixel CRT glow.
crt_bloom=off
; neutral | classic | warm CRT colour response.
crt_color_profile=neutral
; off | light | classic horizontal CRT beam softness.
crt_horizontal_softness=off
; off | simple | cabinet physical CRT surround.
crt_bezel=off
; Show original intro at startup.
intro=true
; Intro hold in seconds, 1..60.
intro_secs=3
; Override story day, 1..11; 0 resumes normal saved day.
day=0
; true plays 11-day arc on a synthetic schedule.
story=false
; Seconds per synthetic day when story=true.
story_secs=90

; Test playback controls (testing only):
; false preserves authentic randomized scheduling.
enabled=false
; true uses saved Custom overrides; false starts faithful original playback.
custom_enabled=true
; off | normal (52 non-story) | special (11 story) | visitors | common | uncommon | all (63).
; Common/uncommon are test buckets, not Sierra's original probabilities.
group=off
; Only special: selected days 1..11. Blank means all special scenes.
days=
; any uses real clock; day forces daylight; night forces night lighting.
time=any
; authentic keeps Sierra's random choice; prefer_high or prefer_low apply only where low tide is allowed.
tide_preference=authentic
; calendar | none | halloween | st_patrick | christmas | new_year.
test_holiday=calendar
; Tests are sequential.
order=sequential
; scene: 0 cycles the selected group; 1..63 repeats one source-table scene.
scene=0
; group_start: 0 starts at the first group entry; 1..63 starts at that scene.
group_start=0
; favorites: comma-separated scene numbers for the Favorites scene set.
favorites=
; Set offset_enabled=true to force X/Y island coordinates for a test scene.
; Cutaway scenes have no island and ignore this override.
offset_enabled=false
; Island offset range: X -640..640, Y -480..480.
offset_x=-90
offset_y=5
; EXAMPLE special city/office scenes at night:
; group=special
; days=3,9,10
; time=night
; EXAMPLE all scenes in daylight:
; group=all
; days=
; time=day
; EXAMPLE authentic behavior:
; enabled=false
; group=off

; none is the faithful hard cut; dissolve enables tiled dissolve.
transition=none

[SceneCatalog]
; Edit the short name or description after =. Keep one value per line.
; These texts affect the Scene Selector and on-screen scene information.
scene_01_short=Dive Scorecards
scene_01_description=Johnny makes three dives from the palm tree: feet-first, belly flop, and cannonball. Sea creatures hold up scorecards.
scene_02_short=Gull Nest on Head
scene_02_description=A gull lands on Johnny's head and starts a nest. Johnny misses it with a club and hits himself.
scene_03_short=Gull Steals Clothes
scene_03_description=While Johnny bathes, a gull steals his clothes and carries them to the palm tree.
scene_04_short=Gull Reads Book
scene_04_description=A gull steals Johnny's book and reads it from the top of the palm tree.
scene_05_short=Palm Tree Dive
scene_05_description=Johnny performs an ordinary dive from the palm tree.
scene_06_short=Rain Dance Lightning
scene_06_description=Johnny changes into native dress, rain-dances, and is struck by lightning.
scene_07_short=Coconut Wake-Up
scene_07_description=Johnny falls asleep reading and wakes when a coconut lands on his head.
scene_08_short=Upside-Down Book
scene_08_description=Johnny realizes he is reading upside down and turns his book around.
scene_09_short=Bathing Viewer Gag
scene_09_description=After bathing, Johnny notices the viewer, dresses behind the tree, and shakes his fist.
scene_10_short=Sightseeing Boat Dance
scene_10_description=Johnny dances for a sightseeing boat, strips naked, and waves leaves at the passengers.
scene_11_short=Sandcastle Meltdown
scene_11_description=Johnny builds a sandcastle, watches it collapse, and stomps on it.
scene_12_short=Lilliputian Tie-Down
scene_12_description=Lilliputian pirates arrive by galleon, tie sleeping Johnny down, and a gull nests on him.
scene_13_short=Sleeping Roll
scene_13_description=Johnny lies down, rolls around in his sleep, and wakes up.
scene_14_short=Lilliputian Castle Attack
scene_14_description=Tiny pirates attack while Johnny builds a sandcastle, occupy it, and launch tiny fighter planes.
scene_15_short=Fire Building Success
scene_15_description=After several attempts, Johnny successfully builds a fire and relaxes.
scene_16_short=Campfire Cooking
scene_16_description=Johnny cooks an octopus, fish, or boot over a fire, with varying bad results.
scene_17_short=Night Lilliputian Tie-Down
scene_17_description=At night, Lilliputian pirates arrive and tie sleeping Johnny down on the beach.
scene_18_short=Fishing Junk Catch
scene_18_description=Johnny catches a starfish, a nose-clamping crab, or a boot and throws it back.
scene_19_short=Fishing Keeper Catch
scene_19_description=Johnny catches wood or a large green fish and hides the catch behind the palm tree.
scene_20_short=Giant Octopus Catch
scene_20_description=Johnny hooks a giant octopus, which steals his fish and sends him climbing the tree.
scene_21_short=Shark Water-Ski
scene_21_description=A shark pulls Johnny from shore and tows him around the water on bare feet.
scene_22_short=Shark Spits Johnny
scene_22_description=A shark swallows Johnny, grimaces at the taste, and spits him back onto shore.
scene_23_short=Fish Face Spray
scene_23_description=A large green fish stares at Johnny, sprays water in his face, and gets thrown back.
scene_24_short=East-Side Junk Catch
scene_24_description=Fishing from the east side, Johnny catches unwanted items and throws them back.
scene_25_short=East-Side Keeper Catch
scene_25_description=Fishing from the east side, Johnny catches a boot or large green fish and hides it.
scene_26_short=Return by Plane
scene_26_description=Day 11: Johnny returns to the island by plane and parachute at sunset.
scene_27_short=SOS Bottle Dream
scene_27_description=Day 2: Johnny writes an SOS message, puts it in a bottle, and throws it into the sea.
scene_28_short=Message to Suzy
scene_28_description=Day 6: Johnny writes a message asking his dream woman to meet him, then bottles it.
scene_29_short=SOS Bottle Returns
scene_29_description=Johnny finds his own SOS bottle and throws it back into the sea.
scene_30_short=SOS Bottle Toss
scene_30_description=Johnny writes an SOS message, bottles it, and throws it into the sea.
scene_31_short=Office Island Dream
scene_31_description=Day 10: Johnny works in an office, dreams of the island and Mary, and regrets leaving.
scene_32_short=Mermaid Dinner Date
scene_32_description=Day 5: Johnny and Mary share dinner and dance before she swims away.
scene_33_short=Mermaid Date Request
scene_33_description=Day 4: Johnny asks Mary the Mermaid for a date and she agrees.
scene_34_short=Mermaid Watches Fishing
scene_34_description=Day 1: Mary watches Johnny fish; he mistakes her splash for a fish.
scene_35_short=Mermaid Mainland Invitation
scene_35_description=Day 7: Johnny invites Mary to the mainland; she cries and swims away.
scene_36_short=Raft Farewell
scene_36_description=Day 8: Mary and the shark say goodbye as Johnny leaves by raft.
scene_37_short=Heat Meltdown
scene_37_description=Johnny tries to cool himself, fans himself, and melts into a puddle.
scene_38_short=Shark Bath Scare
scene_38_description=A shark leaps from the sea while Johnny tests the water and knocks him into the tree.
