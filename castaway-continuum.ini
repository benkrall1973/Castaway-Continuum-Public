scene_52_short=East Spyglass
scene_52_description=Johnny scans from west to east with a spyglass; an eyeball blinks in the lens.
scene_53_short=Suzy Finds Bottle
scene_53_description=Day 3: Suzy finds Johnny's bottle and imagines the castaway who needs help.
scene_54_short=Raft Arrival and Kiss
scene_54_description=Day 9: Johnny reaches Suzy by raft; they embrace, kiss, and she scolds him.
scene_55_short=Missed Rescue Visitors
scene_55_description=Johnny looks the wrong way through his spyglass while aircraft or the SS SOS pass behind him.
scene_56_short=Cargo Ship Crush
scene_56_description=Johnny tries to flag down a cargo ship, then jumps into the water as it plows through the island.
scene_57_short=Coconut Bounce
scene_57_description=A coconut bounces over Johnny's head and rolls into the sea.
scene_58_short=Coconut Head Spin
scene_58_description=A coconut circles Johnny and the tree, spinning his head around before he eats it.
scene_59_short=Coconut Chase
scene_59_description=Johnny chases a fallen coconut, opens it against the tree, and eats and drinks.
scene_60_short=Plane Coconut Crash
scene_60_description=Johnny throws a coconut at a passing plane, crashes it, and the pilot parachutes down.
scene_61_short=Party Boat Return
scene_61_description=Johnny boards a party boat, which later returns him drunk and back on the island.
scene_62_short=Raft Building Wave
scene_62_description=Johnny keeps building his raft, waves toward the viewer, and brushes himself off.
scene_63_short=Island Jog
scene_63_description=Johnny changes into jogging clothes, circles the island, and stretches against the tree.
